name: Build Sandbox Packs

# Builds the self-contained "sandbox pack" (standalone Python runtime + agent packages +
# CLI security tools) for each platform and publishes the tarballs + a checksums file.
# Linux packs are built inside manylinux_2_28 containers so they run on glibc >= 2.28
# (RHEL/Rocky 8+, Ubuntu 20.04+, Debian 10+, Amazon Linux 2023).
#
# Trigger manually, on a packs-only tag (`pack-v*`), OR on an agent release tag
# (`v*`) so EVERY release ships matching sandbox packs — not just the embedded
# copy inside the binary, but standalone tarballs the bridge can auto-pull via
# STROBES_PACK_URL (see strobes_shell_agent/pack.py). On a `v*` tag this runs
# alongside release.yml and appends its pack tarballs to the SAME release.
on:
  # A skills release rebuilds the packs. strobes-co/skills is the source of
  # truth for the system-skill catalog and the 4 SDKs, and the pack BAKES
  # them (see build_pack.py:install_skills) exactly as strobes-sandbox's
  # image does -- a bridge runs on a customer host that may have no route to
  # our S3, so fetching skills at connect is not an option. The skills repo
  # fires this from its own notify workflow on release.
  repository_dispatch:
    types: [skills-updated]
  workflow_dispatch:
  pull_request:
    paths:
      - "sandbox_pack/**"
      - "strobes_shell_agent/pack.py"
      - ".github/workflows/build_sandbox_pack.yml"
  push:
    tags:
      - "pack-v*"
      - "v*"

permissions:
  contents: write

env:
  # Stamp the release tag as each pack's manifest version, so a bridge can tell its
  # pack is stale and auto-pull the new one (pack.needs_update / update_pack). Empty
  # on non-tag runs (PR / manual dispatch) → build_pack.py falls back to a
  # deterministic content hash. Docker-container builds get it via `-e` below.
  STROBES_PACK_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm   # native arm64 runner; falls back via qemu if unavailable
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Checkout strobes-co/skills (baked into the pack)
        # continue-on-error, deliberately: without SKILLS_REPO_TOKEN this step
        # fails, and before skills were baked a pack built fine without it. A
        # missing or expired token must degrade to "pack without skills", not
        # take out every pack build and with it the release. The build step
        # below says loudly which happened.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: strobes-co/skills
          ref: ${{ github.event.client_payload.skills_ref || 'dev' }}
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-src
      - name: Build pack in ${{ matrix.image }}
        run: |
          docker run --rm -e STROBES_PACK_VERSION \
            -v "$PWD/sandbox_pack":/src:ro -v "$PWD/sandbox_pack/out":/out \
            -v "$PWD/skills-src":/skills:ro \
            ${{ matrix.image }} bash -lc '
              set -e
              export HOME=/root PATH=/root/.local/bin:$PATH
              curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null 2>&1
              SKILLS_ARG=""
              if [ -d /skills/skills ]; then
                SKILLS_ARG="--skills-src /skills"
              else
                echo "::warning::no skills checkout (SKILLS_REPO_TOKEN missing?) -- building a pack WITHOUT the skill catalog"
              fi
              uv run --python 3.12 python /src/build_pack.py --out /out $SKILLS_ARG \
                --requirements /src/sandbox-requirements.in \
                --manifest /src/tools.manifest.json \
                --python-version 3.12 --tar
            '
      - name: Validate pack (offline) on Rocky 8
        run: |
          PY=out/linux-${{ matrix.arch }}/python/*/bin/python3
          docker run --rm --network none \
            -v "$PWD/sandbox_pack":/w:ro rockylinux:8 bash -lc "
              \$(ls /w/$PY) /w/test_pack.py --pack /w/out/linux-${{ matrix.arch }} --skip-relocate
            "
      - name: Smoke-test bundled nmap on Alpine (musl, no glibc)
        run: |
          PACK=out/linux-${{ matrix.arch }}
          docker run --rm --network none -v "$PWD/sandbox_pack/$PACK":/p:ro alpine:3.19 sh -lc '
            NMAPDIR=/p/share/nmap/data /p/bin/nmap -sT -Pn -p 80 127.0.0.1 | grep -q "Nmap done"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-pack-linux-${{ matrix.arch }}
          path: sandbox_pack/out/strobes-sandbox-pack-linux-${{ matrix.arch }}.tar.gz

  # Internal-network + Active Directory pack (impacket/nxc/certipy/responder/…). Needs a
  # C + Rust toolchain (netifaces, aardwolf); manylinux has gcc, we add git + rust.
  # Linux is the GATING platform for this profile (it is what the shipped binary/Docker
  # image embeds); macOS and Windows AD packs are built by the non-blocking
  # `internal-ad-macos` / `internal-ad-windows` jobs below.
  internal-ad-linux:
    name: internal-ad-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Checkout strobes-co/skills (baked into the pack)
        # continue-on-error, deliberately: without SKILLS_REPO_TOKEN this step
        # fails, and before skills were baked a pack built fine without it. A
        # missing or expired token must degrade to "pack without skills", not
        # take out every pack build and with it the release. The build step
        # below says loudly which happened.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: strobes-co/skills
          ref: ${{ github.event.client_payload.skills_ref || 'dev' }}
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-src
      - name: Build internal-ad pack in ${{ matrix.image }}
        run: |
          docker run --rm -e STROBES_PACK_VERSION \
            -v "$PWD/sandbox_pack":/src:ro -v "$PWD/sandbox_pack/out":/out \
            -v "$PWD/skills-src":/skills:ro \
            ${{ matrix.image }} bash -lc '
              set -e
              command -v git >/dev/null || yum install -y git >/dev/null 2>&1
              export HOME=/root PATH=/root/.local/bin:/root/.cargo/bin:$PATH
              curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null 2>&1
              curl -LsSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null 2>&1
              SKILLS_ARG=""
              if [ -d /skills/skills ]; then
                SKILLS_ARG="--skills-src /skills"
              else
                echo "::warning::no skills checkout (SKILLS_REPO_TOKEN missing?) -- building a pack WITHOUT the skill catalog"
              fi
              uv run --python 3.12 python /src/build_pack.py --profile internal-ad --out /out $SKILLS_ARG \
                --manifest /src/tools.manifest.json --python-version 3.12 --tar
            '
      # `set -e` and a loop that actually tests $t. The previous version ran
      # `python3 -c 'import shutil,sys; sys.exit(0)'` five times — it never
      # referenced $t, so it asserted nothing about the AD tools — and with no
      # `set -e` the block's exit code was the loop's 0, which swallowed a
      # failing test_pack.py entirely. This validation had never actually run.
      - name: Validate internal-ad pack (offline) on Rocky 8
        run: |
          PACK=out/internal-ad-linux-${{ matrix.arch }}
          docker run --rm --network none -v "$PWD/sandbox_pack":/w:ro rockylinux:8 bash -lc "
            set -euo pipefail
            PY=\$(ls /w/$PACK/python/*/bin/python3 | head -1)
            \$PY /w/test_pack.py --pack /w/$PACK --skip-relocate
            # The pip-installed AD console scripts are the reason this profile
            # exists, so assert them explicitly. Tools that ship as downloaded
            # binaries are NOT listed here — their per-platform availability is
            # recorded in tools.lock.json and already validated by test_pack.py.
            # Hardcoding them here fails honest builds: kerbrute has no arm64
            # release (upstream is amd64/386 only), so demanding it on every
            # platform turns a correct skip into a red build.
            for t in nxc certipy bloodhound-python; do
              if [ ! -x \$(dirname \$PY)/\$t ]; then
                echo \"MISSING internal-ad console script: \$t\"; exit 1;
              fi
              echo \"ok \$t\"
            done
          "
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-pack-internal-ad-linux-${{ matrix.arch }}
          path: sandbox_pack/out/strobes-sandbox-pack-internal-ad-linux-${{ matrix.arch }}.tar.gz

  # Internal-AD pack for macOS (aarch64 + x86_64). NON-BLOCKING by design: it is
  # `continue-on-error` and is deliberately kept OUT of `publish`'s `needs:` list,
  # following the `native-intel` precedent — it self-appends its tarball + .sha256 to
  # the release on a pack-v* tag instead of gating it.
  # Why it may legitimately fail: `Responder` and `enum4linux-ng` are declared *nix-only
  # in tools.manifest.json, and `netexec` pulls a Rust dep (aardwolf) that has to compile
  # from source on non-Linux runners — plus macos-13 (Intel) is a scarce, slow runner.
  # None of that may sink the release.
  internal-ad-macos:
    name: internal-ad-macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14      # Apple silicon
          - arch: x86_64
            runner: macos-13      # Intel
    steps:
      - uses: actions/checkout@v4
      - name: Checkout strobes-co/skills (baked into the pack)
        # continue-on-error, deliberately: without SKILLS_REPO_TOKEN this step
        # fails, and before skills were baked a pack built fine without it. A
        # missing or expired token must degrade to "pack without skills", not
        # take out every pack build and with it the release. The build step
        # below says loudly which happened.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: strobes-co/skills
          ref: ${{ github.event.client_payload.skills_ref || 'dev' }}
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-src
      - name: Install Rosetta 2 (Apple Silicon — bundled nmap is x86_64)
        if: matrix.arch == 'aarch64'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Rust (netexec pulls aardwolf, a Rust extension)
        shell: bash
        run: |
          command -v cargo >/dev/null || \
            curl -LsSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build internal-ad pack
        shell: bash
        run: |
          SKILLS_ARG=""
          if [ -d skills-src/skills ]; then SKILLS_ARG="--skills-src skills-src"; else echo "::warning::no skills checkout (SKILLS_REPO_TOKEN missing?) -- building a pack WITHOUT the skill catalog"; fi
          uv run --python 3.12 python sandbox_pack/build_pack.py --profile internal-ad \
            --out sandbox_pack/out --python-version 3.12 --tar $SKILLS_ARG
      - name: Validate pack
        shell: bash
        run: |
          PACK=sandbox_pack/out/internal-ad-macos-${{ matrix.arch }}
          PY=$(ls "$PACK"/python/*/bin/python3* | head -1)
          "$PY" sandbox_pack/test_pack.py --pack "$PACK"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-pack-internal-ad-macos-${{ matrix.arch }}
          path: sandbox_pack/out/strobes-sandbox-pack-internal-ad-macos-${{ matrix.arch }}.tar.gz
      - name: Checksum + append to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd sandbox_pack/out
          shasum -a 256 strobes-sandbox-pack-internal-ad-macos-${{ matrix.arch }}.tar.gz \
            > strobes-sandbox-pack-internal-ad-macos-${{ matrix.arch }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sandbox_pack/out/strobes-sandbox-pack-internal-ad-macos-${{ matrix.arch }}.tar.gz
            sandbox_pack/out/strobes-sandbox-pack-internal-ad-macos-${{ matrix.arch }}.tar.gz.sha256

  # Internal-AD pack for Windows. Same non-blocking contract as internal-ad-macos:
  # `continue-on-error` + NOT in `publish`'s `needs:`, self-appending to the release.
  # This one is the most likely to fail and that is accepted: `Responder` and
  # `enum4linux-ng` are *nix-only in the manifest (raw sockets) so they are skipped
  # outright, `netexec`'s Rust dep (aardwolf) must build with MSVC, and `netifaces`
  # needs the C toolchain. A red Windows AD build must never sink the release.
  internal-ad-windows:
    name: internal-ad-windows-x86_64
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Checkout strobes-co/skills (baked into the pack)
        # continue-on-error, deliberately: without SKILLS_REPO_TOKEN this step
        # fails, and before skills were baked a pack built fine without it. A
        # missing or expired token must degrade to "pack without skills", not
        # take out every pack build and with it the release. The build step
        # below says loudly which happened.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: strobes-co/skills
          ref: ${{ github.event.client_payload.skills_ref || 'dev' }}
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-src
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ensure Rust toolchain (netexec pulls aardwolf, a Rust extension)
        shell: bash
        run: |
          command -v cargo >/dev/null || \
            (curl -sSf -o rustup-init.exe https://win.rustup.rs/x86_64 && \
             ./rustup-init.exe -y --profile minimal)
          echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
      - name: Build internal-ad pack
        shell: bash
        run: |
          SKILLS_ARG=""
          if [ -d skills-src/skills ]; then SKILLS_ARG="--skills-src skills-src"; else echo "::warning::no skills checkout (SKILLS_REPO_TOKEN missing?) -- building a pack WITHOUT the skill catalog"; fi
          uv run --python 3.12 python sandbox_pack/build_pack.py --profile internal-ad \
            --out sandbox_pack/out --python-version 3.12 --tar $SKILLS_ARG
      - name: Validate pack
        shell: bash
        run: |
          PACK=sandbox_pack/out/internal-ad-windows-x86_64
          PY=$(ls "$PACK"/python/*/python.exe | head -1)
          "$PY" sandbox_pack/test_pack.py --pack "$PACK"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-pack-internal-ad-windows-x86_64
          path: sandbox_pack/out/strobes-sandbox-pack-internal-ad-windows-x86_64.tar.gz
      - name: Checksum + append to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd sandbox_pack/out
          sha256sum strobes-sandbox-pack-internal-ad-windows-x86_64.tar.gz \
            > strobes-sandbox-pack-internal-ad-windows-x86_64.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sandbox_pack/out/strobes-sandbox-pack-internal-ad-windows-x86_64.tar.gz
            sandbox_pack/out/strobes-sandbox-pack-internal-ad-windows-x86_64.tar.gz.sha256

  # Base pack on the runners that must build natively. macos-x86_64 is NOT listed here on
  # purpose — the `native-intel` job below already covers it on the scarce macos-13 runner,
  # off the publish gate. Do not duplicate it into this matrix.
  native:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: macos-aarch64
            runner: macos-14      # Apple silicon
          - triple: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout strobes-co/skills (baked into the pack)
        # continue-on-error, deliberately: without SKILLS_REPO_TOKEN this step
        # fails, and before skills were baked a pack built fine without it. A
        # missing or expired token must degrade to "pack without skills", not
        # take out every pack build and with it the release. The build step
        # below says loudly which happened.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: strobes-co/skills
          ref: ${{ github.event.client_payload.skills_ref || 'dev' }}
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-src
      - name: Install Rosetta 2 (Apple Silicon — nmap is x86_64)
        if: matrix.triple == 'macos-aarch64'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build pack
        shell: bash
        run: |
          SKILLS_ARG=""
          if [ -d skills-src/skills ]; then SKILLS_ARG="--skills-src skills-src"; else echo "::warning::no skills checkout (SKILLS_REPO_TOKEN missing?) -- building a pack WITHOUT the skill catalog"; fi
          uv run --python 3.12 python sandbox_pack/build_pack.py \
            --out sandbox_pack/out --python-version 3.12 --tar $SKILLS_ARG
      - name: Validate pack
        shell: bash
        run: |
          PACK=$(ls -d sandbox_pack/out/${{ matrix.triple }})
          PY=$(ls "$PACK"/python/*/bin/python3* 2>/dev/null | head -1 || ls "$PACK"/python/*/python.exe | head -1)
          "$PY" sandbox_pack/test_pack.py --pack "$PACK"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-pack-${{ matrix.triple }}
          path: sandbox_pack/out/strobes-sandbox-pack-${{ matrix.triple }}.tar.gz

  # Intel macs are a scarce, slow-to-schedule runner — kept OFF the publish gate so it
  # can't block the release. It self-appends its pack to the release whenever it runs.
  native-intel:
    name: macos-x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Checkout strobes-co/skills (baked into the pack)
        # continue-on-error, deliberately: without SKILLS_REPO_TOKEN this step
        # fails, and before skills were baked a pack built fine without it. A
        # missing or expired token must degrade to "pack without skills", not
        # take out every pack build and with it the release. The build step
        # below says loudly which happened.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: strobes-co/skills
          ref: ${{ github.event.client_payload.skills_ref || 'dev' }}
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-src
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build pack
        shell: bash
        run: |
          SKILLS_ARG=""
          if [ -d skills-src/skills ]; then SKILLS_ARG="--skills-src skills-src"; else echo "::warning::no skills checkout (SKILLS_REPO_TOKEN missing?) -- building a pack WITHOUT the skill catalog"; fi
          uv run --python 3.12 python sandbox_pack/build_pack.py \
            --out sandbox_pack/out --python-version 3.12 --tar $SKILLS_ARG
      - name: Validate pack
        shell: bash
        run: |
          PACK=sandbox_pack/out/macos-x86_64
          PY=$(ls "$PACK"/python/*/bin/python3* | head -1)
          "$PY" sandbox_pack/test_pack.py --pack "$PACK"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-pack-macos-x86_64
          path: sandbox_pack/out/strobes-sandbox-pack-macos-x86_64.tar.gz
      - name: Checksum + append to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd sandbox_pack/out
          shasum -a 256 strobes-sandbox-pack-macos-x86_64.tar.gz \
            > strobes-sandbox-pack-macos-x86_64.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sandbox_pack/out/strobes-sandbox-pack-macos-x86_64.tar.gz
            sandbox_pack/out/strobes-sandbox-pack-macos-x86_64.tar.gz.sha256

  publish:
    needs: [linux, internal-ad-linux, native]
    runs-on: ubuntu-latest
    # Publish whatever packs built. !cancelled() lets a slow/failed leg (e.g. the scarce
    # Intel-mac runner) not sink the release; re-running that job later re-publishes it.
    #
    # Also publishes on a skills release. Until now this was tag-only, so a
    # skills-updated dispatch built correct packs and then threw them away as
    # workflow artifacts -- which have no stable URL a daemon can fetch. The
    # effect was that a skills release could never reach a deployed bridge: it
    # rebuilt packs nobody could download. Those runs publish to the rolling
    # `pack-latest` release instead of a tag, because a skills release is not
    # a bridge release and must not invent a version number for the agent.
    if: >-
      ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/')
          || github.event_name == 'repository_dispatch') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Resolve the release tag and the pack version
        id: rel
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=pack-latest" >> "$GITHUB_OUTPUT"
            echo "rolling=true"    >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "rolling=false"   >> "$GITHUB_OUTPUT"
          fi

          # The version the daemon compares against is the one stamped INSIDE
          # the pack, not the tag: on a dispatch run STROBES_PACK_VERSION is
          # empty and build_pack.py falls back to a deterministic hash of the
          # pack's contents, so it changes exactly when the skills or SDKs do.
          # Read it back out of a built pack rather than recomputing it here,
          # so the advertised version cannot drift from the shipped one.
          mkdir -p _v && tar -xzf "$(ls dist/strobes-sandbox-pack-linux-x86_64.tar.gz)" -C _v
          VERSION=$(python3 -c "import glob,json;print(json.load(open(glob.glob('_v/*/pack.manifest.json')[0]))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pack version: $VERSION"

          # Published as a plain asset so the backend can read it with one
          # unauthenticated GET. Deliberately NOT the GitHub API: that is 60
          # requests/hour unauthenticated, and every bridge connect would
          # spend one.
          printf '%s\n' "$VERSION" > dist/pack.version
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          # The rolling release is a prerelease so it never becomes
          # `releases/latest` and cannot be mistaken for an agent release.
          prerelease: ${{ steps.rel.outputs.rolling }}
          # On a packs-only `pack-v*` tag this job OWNS the release, so title it.
          # On an agent `v*` tag release.yml owns the title/notes — leave `name`
          # empty (the action keeps the existing release's name, i.e. the tag) and
          # only APPEND the pack section so we augment that release instead of
          # renaming or clobbering it. Files are added either way.
          name: ${{ steps.rel.outputs.rolling == 'true' && 'Sandbox packs (rolling)' || (startsWith(github.ref, 'refs/tags/pack-v') && format('Sandbox packs {0}', github.ref_name) || '') }}
          append_body: true
          body: |
            ### Bridge sandbox packs
            Self-contained bridge sandbox packs (standalone Python + agent packages +
            CLI tools: nmap, naabu, nuclei, httpx, katana, tlsx, ffuf, gobuster,
            subfinder, dnsx; internal-ad packs add kerbrute).

            The bridge auto-downloads/updates the pack for its OS/arch via
            `STROBES_PACK_URL=https://github.com/${{ github.repository }}/releases/download/${{ steps.rel.outputs.tag }}`,
            or automatically when the backend advertises `required_pack_version`
            (pack version in this release: `${{ steps.rel.outputs.version }}`).
            Each `*.tar.gz` has a matching `*.sha256` for integrity verification.
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/pack.version
